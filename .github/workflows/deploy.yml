name: Deploy

# Triển khai lên VPS Ubuntu 22.04 qua SSH, chạy từ runner của GitHub
# (không cần self-hosted runner trên VPS).
#
# YÊU CẦU TRƯỚC KHI DÙNG:
#   1. Chạy deploy/provision-vps.sh trên VPS một lần (cài runtime, systemd,
#      nginx, tạo /var/www/newscms).
#   2. Điền connection string thật vào
#      /var/www/newscms/shared/appsettings.Production.json trên VPS.
#      Secret KHÔNG nằm trong GitHub - migration đọc thẳng từ file này.
#   3. Settings -> Environments -> tạo "production", bật Required reviewers.
#      Tất cả đều là Secrets (không dùng Variables):
#        VPS_SSH_KEY  private key, khớp key đã thêm vào authorized_keys
#        VPS_HOST     IP/hostname của VPS
#        VPS_USER     tuỳ chọn, mặc định root - deploy cần systemctl + ghi
#                     /var/www. Bản thân app không chạy bằng root
#                     (systemd User=newscms).
#        DEPLOY_ROOT  tuỳ chọn, mặc định /var/www/newscms
#      Lưu ý: secret bị mask trong log, nên các dòng log có chứa host/đường dẫn
#      sẽ hiện *** thay vì giá trị thật.
#
# Cách deploy: mỗi lần tạo releases/<sha> mới rồi đổi symlink `current`.
# Rollback chỉ là trỏ symlink về release trước + restart.
#
# KHI NÀO CHẠY:
#   - Tự động: sau khi workflow "CI" chạy XONG và PASS trên master/main
#     (push code -> CI build+test -> CI xanh -> Deploy). CI đỏ thì không deploy.
#   - Thủ công: workflow_dispatch (có checkbox bỏ qua migration).
#   - Tag v*: deploy ngay, KHÔNG qua CI.

on:
  # workflow_run yêu cầu file workflow này nằm trên default branch (master).
  # branches ở đây lọc theo head_branch của run CI, nên CI của pull request
  # (head_branch = branch nguồn) không kích hoạt deploy.
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Chạy EF migration trước khi đổi symlink'
        type: boolean
        default: true
  push:
    tags: ['v*']

env:
  DOTNET_VERSION: '8.0.x'
  WEB_PROJECT: NewsCMS.Core/src/NewsCMS.Web/NewsCMS.Web.csproj
  RID: linux-x64
  APP_PORT: '5000'
  SERVICE: newscms
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Không bao giờ deploy 2 run cùng lúc lên một server.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production (Ubuntu VPS)
    runs-on: ubuntu-latest
    environment: production
    # CI fail/cancel -> không deploy. Với dispatch và tag push thì không có
    # workflow_run nên điều kiện đầu đã đúng.
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      # workflow_run mặc định checkout HEAD của default branch, KHÔNG phải commit
      # mà CI vừa test. Nếu có commit mới hơn đã push thì sẽ deploy sai code, nên
      # phải ghim đúng head_sha của run CI.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve deploy target
        run: |
          host="${{ secrets.VPS_HOST }}"
          if [ -z "$host" ]; then
            echo "::error::Chưa set secret VPS_HOST (Settings -> Environments -> production -> Secrets)."
            exit 1
          fi
          # Cùng lý do như bước checkout: github.sha của workflow_run là HEAD
          # default branch, không phải commit đã được CI test.
          sha="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          echo "VPS_HOST=$host"                                           >> "$GITHUB_ENV"
          echo "VPS_USER=${{ secrets.VPS_USER || 'root' }}"               >> "$GITHUB_ENV"
          echo "DEPLOY_ROOT=${{ secrets.DEPLOY_ROOT || '/var/www/newscms' }}" >> "$GITHUB_ENV"
          echo "RELEASE=$sha"                                             >> "$GITHUB_ENV"
          echo "Sẽ deploy commit $sha (trigger: ${{ github.event_name }})"

      # Publish PORTABLE, cố ý KHÔNG truyền -r linux-x64.
      #
      # Systemd chạy app bằng `/usr/bin/dotnet .../NewsCMS.Web.dll` (xem
      # provision-vps.sh) nên apphost native của RID build không được dùng tới.
      # Ngược lại, build kèm RID đẩy output sang bin/Release/net8.0/linux-x64/
      # trong khi `dotnet ef migrations bundle --no-build` lại tìm deps.json ở
      # bin/Release/net8.0/ -> "The specified deps.json does not exist", exit 129.
      # Bỏ RID thì mọi bước dùng chung một output, chỉ build một lần.
      #
      # Ở mức PROJECT chứ không phải solution: build riêng NewsCMS.Web vẫn kéo
      # theo toàn bộ ProjectReference (5 theme, Infrastructure, Application,
      # Domain, Shared). Test không build ở đây - đó là việc của ci.yml.
      - name: Restore
        run: dotnet restore ${{ env.WEB_PROJECT }}

      - name: Build
        run: >
          dotnet build ${{ env.WEB_PROJECT }}
          --configuration Release
          --no-restore

      # Framework-dependent: VPS đã có aspnetcore-runtime-8.0.
      - name: Publish
        run: >
          dotnet publish ${{ env.WEB_PROJECT }}
          --configuration Release
          --no-build
          --self-contained false
          -o publish

      # dotnet-ef là local tool (NewsCMS.Core/.config/dotnet-tools.json).
      - name: Restore local tools
        working-directory: NewsCMS.Core
        run: dotnet tool restore

      # Migration bundle = 1 file thực thi tự chứa migration, chỉ cần runtime.
      # Nhờ vậy VPS không phải cài .NET SDK.
      - name: Build EF migration bundle
        working-directory: NewsCMS.Core
        run: >
          dotnet ef migrations bundle
          --project src/NewsCMS.Infrastructure
          --startup-project src/NewsCMS.Web
          --configuration Release
          --no-build
          --target-runtime ${{ env.RID }}
          --output ${{ github.workspace }}/publish/efbundle
          --force

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Ghim host key để tránh MITM thay vì dùng StrictHostKeyChecking=no.
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<CFG
          Host deploy-target
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          CFG
          chmod 600 ~/.ssh/config
          ssh -o ConnectTimeout=15 deploy-target 'echo SSH OK; . /etc/os-release; echo "$PRETTY_NAME"'

      - name: Preflight checks on server
        run: |
          ssh deploy-target bash -euo pipefail <<REMOTE
            root='$DEPLOY_ROOT'
            for d in "\$root/releases" "\$root/shared"; do
              [ -d "\$d" ] || { echo "::error::Thiếu \$d - chưa chạy provision-vps.sh?"; exit 1; }
            done
            cfg="\$root/shared/appsettings.Production.json"
            [ -f "\$cfg" ] || { echo "::error::Thiếu \$cfg"; exit 1; }
            if grep -q REPLACE_ME "\$cfg"; then
              echo "::error::\$cfg vẫn còn REPLACE_ME - chưa điền connection string thật."
              exit 1
            fi
            command -v dotnet >/dev/null || { echo "::error::VPS chưa có dotnet runtime"; exit 1; }
            command -v jq     >/dev/null || { echo "::error::VPS chưa có jq"; exit 1; }
            # Deploy cần systemctl + chown + ghi vào /var/www -> yêu cầu root.
            # App KHÔNG chạy bằng root: systemd unit dùng User=newscms.
            if [ "\$(id -u)" -ne 0 ]; then
              echo "::error::VPS_USER phải là root (đang là \$(id -un))."
              exit 1
            fi
            echo "Preflight OK (deploy root=\$root)"
          REMOTE

      # Ghi lại release đang chạy để rollback được nếu bước sau fail.
      - name: Record current release
        run: |
          prev=$(ssh deploy-target "readlink -f '$DEPLOY_ROOT/current' 2>/dev/null || true")
          echo "PREV_RELEASE=$prev" >> "$GITHUB_ENV"
          echo "Release đang chạy: ${prev:-<chưa có>}"

      - name: Upload release
        run: |
          target="$DEPLOY_ROOT/releases/$RELEASE"
          ssh deploy-target "mkdir -p '$target'"
          rsync -az --delete \
            -e "ssh -o ConnectTimeout=15" \
            publish/ "deploy-target:$target/"
          echo "Đã đẩy $(du -sh publish | cut -f1) lên $target"

      # uploads/logs/appsettings.Production.json nằm ở shared/ nên deploy không
      # ghi đè dữ liệu production.
      - name: Link shared data
        run: |
          ssh deploy-target bash -euo pipefail <<REMOTE
            root='$DEPLOY_ROOT'
            rel="\$root/releases/$RELEASE"

            mkdir -p "\$rel/wwwroot"
            rm -rf   "\$rel/wwwroot/uploads"
            ln -sfn  "\$root/shared/uploads" "\$rel/wwwroot/uploads"

            rm -rf  "\$rel/logs"
            ln -sfn "\$root/shared/logs" "\$rel/logs"

            # App_Data chứa DataProtection key ring + state Telegram bot. Nếu để
            # nó trong release thì mỗi lần deploy sẽ logout sạch session và bot
            # gửi lại thông báo cũ. ContentRootPath = WorkingDirectory =
            # current/ -> current/App_Data chính là \$rel/App_Data.
            rm -rf  "\$rel/App_Data"
            ln -sfn "\$root/shared/App_Data" "\$rel/App_Data"

            ln -sfn "\$root/shared/appsettings.Production.json" \
                    "\$rel/appsettings.Production.json"

            # -h: đổi chủ chính symlink, không đi theo link để chown cả shared/.
            chown -Rh newscms:newscms "\$rel"
            echo "Đã link shared data"
          REMOTE

      # Migration chạy TRƯỚC khi đổi symlink: nếu schema fail thì app cũ vẫn
      # đang chạy nguyên vẹn.
      # workflow_run và tag push: luôn migrate (inputs rỗng). Dispatch: theo checkbox.
      # Không dùng `inputs.run_migrations != false` - GitHub coerce null và
      # false về cùng 0 nên tag push sẽ bị skip migration.
      - name: Apply EF migrations
        if: github.event_name != 'workflow_dispatch' || inputs.run_migrations
        run: |
          ssh deploy-target bash -euo pipefail <<REMOTE
            root='$DEPLOY_ROOT'
            rel="\$root/releases/$RELEASE"
            conn=\$(jq -re '.ConnectionStrings.Default' \
                     "\$root/shared/appsettings.Production.json")

            chmod +x "\$rel/efbundle"
            cd "\$rel"
            # --connection tường minh: không phụ thuộc thứ tự nạp config.
            ./efbundle --connection "\$conn"
            echo "Migration xong"
          REMOTE

      - name: Switch symlink and restart
        run: |
          ssh deploy-target bash -euo pipefail <<REMOTE
            root='$DEPLOY_ROOT'
            ln -sfn "\$root/releases/$RELEASE" "\$root/current"
            systemctl restart ${{ env.SERVICE }}
            sleep 3
            systemctl is-active --quiet ${{ env.SERVICE }} \
              || { journalctl -u ${{ env.SERVICE }} -n 40 --no-pager; exit 1; }
            echo "Service đang chạy"
          REMOTE

      - name: Health check
        run: |
          ssh deploy-target bash -euo pipefail <<'REMOTE'
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                     "http://127.0.0.1:${{ env.APP_PORT }}/" || echo 000)
              if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
                echo "OK (HTTP $code) sau $i lần thử"; exit 0
              fi
              echo "Lần $i chưa lên (HTTP $code)"; sleep 5
            done
            echo "::error::App không phản hồi sau 60s"
            journalctl -u ${{ env.SERVICE }} -n 60 --no-pager
            exit 1
          REMOTE

      # Chỉ rollback symlink. Migration đã apply thì KHÔNG tự revert:
      # EF down-migration có thể mất dữ liệu nên phải xử lý tay.
      - name: Rollback on failure
        if: failure() && env.PREV_RELEASE != ''
        run: |
          echo "::warning::Deploy fail - rollback về $PREV_RELEASE"
          ssh deploy-target bash -euo pipefail <<REMOTE
            ln -sfn '$PREV_RELEASE' '$DEPLOY_ROOT/current'
            systemctl restart ${{ env.SERVICE }}
            sleep 3
            systemctl is-active --quiet ${{ env.SERVICE }} && echo "Đã rollback"
          REMOTE
          echo "::warning::Đã rollback file. Nếu migration đã chạy thì phải kiểm tra schema bằng tay."

      # Giữ 5 release gần nhất để rollback, xoá cũ hơn.
      - name: Prune old releases
        if: always()
        run: |
          ssh deploy-target bash -euo pipefail <<REMOTE
            cd '$DEPLOY_ROOT/releases' || exit 0
            keep=\$(readlink -f '$DEPLOY_ROOT/current' | xargs -r basename)
            # Chỉ xét thư mục tên đúng 40 ký tự hex (git SHA). Glob */ cũ cũng
            # khớp releases/App_Data -> sau 5 lần deploy sẽ xoá mất symlink chứa
            # DataProtection key ring.
            for d in *; do
              [ -d "\$d" ] || continue
              [ -L "\$d" ] && continue
              [ \${#d} -eq 40 ] || continue
              case "\$d" in *[!0-9a-f]*) continue ;; esac
              printf '%s\t%s\n' "\$(stat -c %Y "\$d")" "\$d"
            done | sort -rn | tail -n +6 | cut -f2 | while read -r d; do
              [ "\$d" = "\$keep" ] && continue
              rm -rf -- "\$d" && echo "Đã xoá release cũ \$d"
            done
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
