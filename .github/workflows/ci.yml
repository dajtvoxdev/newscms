name: CI

on:
  # CI chỉ chạy cho branch production. Commit thẳng lên master không chạy gì cả —
  # đánh đổi có chủ ý: mất cảnh báo sớm trên master, nhưng vẫn còn chốt chặn vì
  # mở PR từ master vào prod/chukafe sẽ kích hoạt trigger pull_request bên dưới.
  #
  # Đừng bỏ 'prod/*' khỏi push: Deploy nghe kết quả CI của prod/chukafe, không có
  # run CI nào ở đó thì chuỗi push -> CI -> Deploy đứt và không deploy được nữa.
  push:
    branches: ['prod/*']
  pull_request:
    branches: ['prod/*']
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION: NewsCMS.Core/NewsCMS.Core.sln
  WEB_PROJECT: NewsCMS.Core/src/NewsCMS.Web/NewsCMS.Web.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

# Push mới trên cùng một branch sẽ huỷ run cũ đang chạy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Không có packages.lock.json nên key cache dựa trên csproj + Directory.Build.props.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NewsCMS.Core/**/*.csproj', 'NewsCMS.Core/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      # Unit test KHÔNG chạy trong CI (bỏ theo yêu cầu 2026-09-07): test chạy local
      # trước khi commit (dotnet test — lưu ý bẫy độ sâu ArtifactsPath của
      # NavbarUnitSummaryTests, xem memory newscms-tests-artifacts-path-depth).
      # Muốn bật lại trong CI: lấy step "Unit test" + "Upload test results" từ lịch sử git.

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NewsCMS.Core/tests/e2e
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: NewsCMS.Core/tests/e2e/package-lock.json

      - name: Install deps
        run: npm ci

      # playwright.config.cjs cố ý không có webServer: các spec tự dựng DOM/iframe
      # bằng data: URL nên không cần app hay DB chạy trong CI.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: NewsCMS.Core/tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish artifact
    needs: [build-test, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NewsCMS.Core/**/*.csproj', 'NewsCMS.Core/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Framework-dependent linux-x64: VPS đích (Ubuntu 22.04) đã cài
      # aspnetcore-runtime-8.0 qua deploy/provision-vps.sh.
      - name: Publish
        run: >
          dotnet publish ${{ env.WEB_PROJECT }}
          --configuration Release
          -r linux-x64
          --self-contained false
          -o ${{ github.workspace }}/publish

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: newscms-web-${{ github.sha }}
          path: publish
          retention-days: 30
